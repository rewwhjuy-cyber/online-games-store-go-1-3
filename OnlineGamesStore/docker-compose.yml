services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: online_games_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_games_store"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
